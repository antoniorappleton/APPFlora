<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b4332" />
    <title>Sem ligação - FloraCare</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f9f9f6;
        color: #1b4332;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }

      main {
        max-width: 30rem;
        text-align: center;
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: #1b4332;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p aria-hidden="true" style="font-size: 3rem; margin: 0">🌿</p>
      <h1>Está sem ligação à internet</h1>
      <p>
        Não foi possível abrir esta página. Verifique a sua ligação ou volte à
        página inicial, que pode estar disponível offline.
      </p>
      <a href="../index.html">Voltar à página inicial</a>
    </main>
  </body>
</html>
